# Run whichever edition you need:
#   docker compose --profile light up -d --build
#   docker compose --profile ui    up -d --build
#
# Both build the same Dockerfile, each selecting its own target.

services:
  isitdown-light:
    build:
      context: .
      dockerfile: Dockerfile
      target: light
    image: isitdown:light
    container_name: isitdown-light
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.yml:/app/config/config.yml:ro
      - isitdown-light-data:/app/data
    profiles: ["light"]

  isitdown-ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    image: isitdown:ui
    container_name: isitdown-ui
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    # No config.yml: the UI edition keeps its configuration in SQLite.
    volumes:
      - isitdown-ui-data:/app/data
    profiles: ["ui"]

volumes:
  isitdown-light-data:
  isitdown-ui-data:
