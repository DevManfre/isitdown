# Development override: run the UI edition straight from the source tree.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile ui up -d
#   (or: npm run dev:docker)
#
# Node 24 strips the TypeScript types at load time, so the container needs no
# build step: `src` is mounted read-only, `node --watch` restarts the server
# when a `.ts` file changes, and the dashboard is served from the mounted
# `src/ui/public` — a hard refresh is enough for CSS/JS/HTML/locale edits.
#
# The image is still the production one, so build it once (`--build`) after a
# dependency change; everything else is live.
services:
  isitdown-ui:
    build:
      target: ui
    environment:
      NODE_ENV: development
      WEB_DIR: /app/dist/ui/web
    volumes:
      - ./src:/app/src:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
      - ./tsconfig.web.json:/app/tsconfig.web.json:ro
      - isitdown-ui-build:/app/dist
    command:
      - sh
      - -c
      - "npx vite build --watch & exec node --watch src/ui/server.ts"

volumes:
  isitdown-ui-build:
