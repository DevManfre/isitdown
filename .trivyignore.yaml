# Accepted CVEs — roadmap 9.6, see tools/cve-exceptions.mjs and
# docs/development.md §9.7. The supply-chain workflow fails on a HIGH or
# CRITICAL vulnerability with a fix available; an entry here accepts one CVE,
# with the reason and the date it stops being accepted. `npm run
# check:cve-exceptions` refuses an entry without either, and fails CI the day
# after it expires.
#
#   - id: CVE-2026-12345
#     statement: the vulnerable path is never reached — why, in one sentence
#     expired_at: 2026-12-31
#     paths: [package-lock.json]
