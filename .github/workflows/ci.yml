# Every push to a long-lived branch and every pull request must pass exactly
# what a contributor runs locally: typecheck, unit tests, integration tests,
# a build as a smoke check, and the visual baselines. Nothing in the release
# workflow is trusted unless this one is green first — release.yml reads this
# workflow's conclusion for the tagged commit instead of re-running it.
#
# Jobs side by side rather than one in sequence: each gets its own runner,
# so the run takes as long as its slowest job instead of the sum of all of them.
# None depends on another's output, so none waits on another.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

# A new push to the same branch or PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Typecheck, lint, README parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # node-version-file keeps .nvmrc the single source of truth for the
      # runtime, exactly as it is for a local checkout.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck (server + dashboard)
        run: npm run typecheck

      # Correctness and suspicious rule groups only; no formatter.
      - name: Lint (check only)
        run: npm run lint

      # Roadmap 7.6. The Italian README is a translation of the English one,
      # section for section; this fails a hand edit that landed in only one of
      # them before it can reach main.
      - name: README translation parity
        run: npm run check:readme

  # Roadmap 7.2. The same two suites `npm test` runs, each under a coverage
  # floor: a new subsystem that lands without tests of its own drags the total
  # under the floor and fails here rather than going unnoticed. One job per
  # suite, because each one alone keeps a runner's cores busy.
  server-tests:
    name: Server tests (node:test, coverage) + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Unit tests with a coverage floor (node:test)
        run: npm run coverage:server

      - name: Integration tests
        run: npm run test:integration

  # Vitest is the slowest suite, so it runs as two shards on two runners. A
  # shard sees half the files, so its own coverage is always under the floor:
  # coverage:web:shard records without judging, and dashboard-coverage merges
  # both halves and applies the floor to the whole, exactly as coverage:web
  # does locally.
  dashboard-tests:
    name: Dashboard tests (Vitest, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # outputFile resolves against Vite's root (src/ui/web), not the checkout.
      - name: Unit tests, coverage recorded (Vitest)
        run: npm run coverage:web:shard -- --shard=${{ matrix.shard }}/2 --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: src/ui/web/.vitest-reports
          include-hidden-files: true
          if-no-files-found: error

  dashboard-coverage:
    name: Dashboard coverage floor (merged shards)
    needs: dashboard-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v5
        with:
          pattern: vitest-blob-*
          path: src/ui/web/.vitest-reports
          merge-multiple: true

      # Fails on a failed test in either shard as well as on the floor.
      - name: Coverage floor over both shards (Vitest)
        run: npm run coverage:web:merge

  build:
    name: Build, bundle budget, visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Builds every edition once: a compile or bundling error must fail here,
      # not at release time.
      - name: Build (smoke check)
        run: npm run build

      # Roadmap 5.16. After the build, because it weighs what the build
      # emitted: a dependency that quietly doubles the dashboard fails here.
      - name: Bundle-size budget
        run: npm run check:bundle

      # After the build, because it screenshots the bundle in dist/. The
      # browser is Playwright's cached Chromium, installed here rather than
      # carried as a dependency — the harness drives it over the DevTools
      # protocol and imports nothing from the package. The release is pinned
      # on purpose: a different Chromium can move pixels, so bump it together
      # with a reviewed baseline commit.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.64.1-${{ runner.os }}

      - name: Install Chromium for the visual check
        run: npx --yes playwright@1.64.1 install --with-deps chromium

      - name: Visual regression (every view, both themes, both locales)
        run: npm run test:visual

      # The rendered frames, so a failure can be looked at rather than argued
      # about. Only on failure: 24 screenshots per green run is noise.
      - name: Upload the rendered views
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: test/visual/current
          if-no-files-found: ignore

  # The one check `main`'s ruleset requires, and the one release.yml reads for
  # the tagged commit — kept under its old name so neither had to change when
  # the single `verify` job was split into the jobs above. `always()` so a
  # failed or cancelled dependency still reports here as a failure rather than
  # as "skipped", which a required check would let through.
  verify:
    needs: [static, server-tests, dashboard-tests, dashboard-coverage, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job above passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
