# Every push to a long-lived branch and every pull request must pass exactly
# what a contributor runs locally: typecheck, unit tests, integration tests,
# a build as a smoke check, and the visual baselines. Nothing in the release
# workflow is trusted unless this one is green first.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

# A new push to the same branch or PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # node-version-file keeps .nvmrc the single source of truth for the
      # runtime, exactly as it is for a local checkout.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck (server + dashboard)
        run: npm run typecheck

      # Roadmap 7.2. The same two suites `npm test` runs, under a coverage
      # floor: a new subsystem that lands without tests of its own drags the
      # total under the floor and fails here rather than going unnoticed.
      - name: Unit tests with a coverage floor (node:test + Vitest)
        run: npm run coverage

      - name: Integration tests
        run: npm run test:integration

      # Roadmap 7.6. The Italian README is a translation of the English one,
      # section for section; this fails a hand edit that landed in only one of
      # them before it can reach main.
      - name: README translation parity
        run: npm run check:readme

      # Builds every edition once: a compile or bundling error must fail here,
      # not at release time.
      - name: Build (smoke check)
        run: npm run build

      # After the build, because it screenshots the bundle in dist/. The
      # browser is Playwright's cached Chromium, installed here rather than
      # carried as a dependency — the harness drives it over the DevTools
      # protocol and imports nothing from the package.
      - name: Install Chromium for the visual check
        run: npx --yes playwright@latest install --with-deps chromium

      - name: Visual regression (every view, both themes, both locales)
        run: npm run test:visual

      # The rendered frames, so a failure can be looked at rather than argued
      # about. Only on failure: 24 screenshots per green run is noise.
      - name: Upload the rendered views
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: test/visual/current
          if-no-files-found: ignore
