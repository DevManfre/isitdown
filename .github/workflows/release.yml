# Tag-driven release, run two ways: tag-release.yml calls it with the tag it
# has just created when a release is merged into `main`, and pushing a
# `vX.Y.Z` tag by hand runs it directly. The workflow verifies the tag against
# package.json and then reads the version out of package.json — the tag is a
# trigger, not a second source of truth.
#
# Both editions come out of the same Dockerfile and the `ui` stage starts FROM
# `light`, so one buildx invocation per target is enough; there is no
# cross-image dependency to resolve.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The `vX.Y.Z` tag to release, already pushed
        required: true
        type: string

permissions:
  contents: write # create the GitHub release
  packages: write # push to GHCR
  id-token: write # keyless cosign signing via the workflow's OIDC token
  checks: read # CI's `verify` check on the tagged commit

env:
  # GHCR rejects an uppercase reference, and the owner is spelled DevManfre.
  IMAGE: ghcr.io/devmanfre/isitdown
  # Called, github.ref_name is the caller's branch (`main`); the tag comes in
  # as an input. Pushed, there is no input and the ref is the tag.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    # One release per tag at a time, whichever way it started; a second one
    # queues behind the first rather than pushing the same images beside it.
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      # Full history: the release notes are generated from the commits since
      # the previous tag. The tag, not the caller's `main`, is what is built.
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      # The commit the tag points at — for a pushed tag the same one as
      # GITHUB_SHA, for a called run the `main` commit that was tagged.
      - name: Resolve the tagged commit
        run: echo "RELEASE_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A tag push does not run the CI workflow, and an image nobody verified
      # must not reach a registry. Rather than re-running a subset of it here,
      # wait for CI's own `verify` check on the tagged commit — the same check
      # `main`'s ruleset requires, and a superset of what this step used to run
      # (coverage floors, build, bundle budget, visual baselines). A tag pushed
      # right behind `main` waits for that run instead of racing it; a commit
      # CI never saw, or one it failed, stops the release here.
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?check_name=verify" \
              -q '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | "\(.status // "missing") \(.conclusion // "")"')
            case "$state" in
              "completed success") echo "CI passed on $RELEASE_SHA"; exit 0 ;;
              completed*) echo "CI did not pass on $RELEASE_SHA: $state" >&2; exit 1 ;;
            esac
            echo "CI on $RELEASE_SHA: $state — waiting"
            sleep 15
          done
          echo "no finished CI run on $RELEASE_SHA after 30 minutes" >&2
          exit 1

      - name: Read the version from package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # arm64 is built under emulation: the audience is Raspberry Pi and ARM
      # VPS owners, and storage is node:sqlite, so there is no native module to
      # cross-compile.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Light edition
        id: light
        uses: docker/build-push-action@v6
        with:
          context: .
          target: light
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:light-latest
            ${{ env.IMAGE }}:light-v${{ steps.version.outputs.version }}
          # Without a cache the arm64 leg roughly doubles the release time.
          cache-from: type=gha,scope=light
          cache-to: type=gha,mode=max,scope=light
          sbom: true
          provenance: mode=max

      - name: Build and push the UI edition
        id: ui
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:ui-latest
            ${{ env.IMAGE }}:ui-v${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v3

      # Keyless: the signature is bound to this workflow's identity, so a
      # verifier can check *what built the image*, not just that it is signed.
      - name: Sign both images
        run: |
          cosign sign --yes "${IMAGE}@${{ steps.light.outputs.digest }}"
          cosign sign --yes "${IMAGE}@${{ steps.ui.outputs.digest }}"

      # Grouped by commit TITLE — see tools/release-notes.mjs.
      - name: Generate the release notes
        run: node tools/release-notes.mjs "$TAG" > release-notes.md

      # The single-file Light edition (roadmap 6.7), for an operator who wants
      # neither Docker nor a Node install. Built on the runner whose Node is
      # the one in .nvmrc, so the binary is that version; Linux x64 only, which
      # is what this runner is — a matrix across macOS and Windows runners is
      # the shape to add when somebody asks for one.
      - name: Build the single-file Light edition
        run: npm run build:sea

      - name: Name the binary after the release
        run: |
          mv dist/sea/isitdown-light "isitdown-light-${TAG}-linux-x64"
          sha256sum "isitdown-light-${TAG}-linux-x64" > "isitdown-light-${TAG}-linux-x64.sha256"

      # tag_name explicit: its default is github.ref, which a called run has
      # pointing at `main`.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: release-notes.md
          make_latest: true
          # Attached rather than pushed anywhere: a 120MB binary is a download
          # an operator asks for once, not something a registry should carry.
          # config.schema.json (roadmap 11.5): the schema of this version's
          # config.yml, at a URL that never moves once the release exists.
          files: |
            isitdown-light-${{ env.TAG }}-linux-x64
            isitdown-light-${{ env.TAG }}-linux-x64.sha256
            schema/config.schema.json
