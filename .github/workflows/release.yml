# Tag-driven release: `npm version <patch|minor|major>` creates the commit and
# the `vX.Y.Z` tag, pushing the tag runs this. The workflow verifies the tag
# against package.json and then reads the version out of package.json — the tag
# is a trigger, not a second source of truth.
#
# Both editions come out of the same Dockerfile and the `ui` stage starts FROM
# `light`, so one buildx invocation per target is enough; there is no
# cross-image dependency to resolve.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  packages: write # push to GHCR
  id-token: write # keyless cosign signing via the workflow's OIDC token

env:
  # GHCR rejects an uppercase reference, and the owner is spelled DevManfre.
  IMAGE: ghcr.io/devmanfre/isitdown

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history: the release notes are generated from the commits since
      # the previous tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A tag push does not run the CI workflow, and an image nobody verified
      # must not reach a registry.
      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run test:integration

      - name: Read the version from package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # arm64 is built under emulation: the audience is Raspberry Pi and ARM
      # VPS owners, and storage is node:sqlite, so there is no native module to
      # cross-compile.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Light edition
        id: light
        uses: docker/build-push-action@v6
        with:
          context: .
          target: light
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:light-latest
            ${{ env.IMAGE }}:light-v${{ steps.version.outputs.version }}
          # Without a cache the arm64 leg roughly doubles the release time.
          cache-from: type=gha,scope=light
          cache-to: type=gha,mode=max,scope=light
          sbom: true
          provenance: mode=max

      - name: Build and push the UI edition
        id: ui
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:ui-latest
            ${{ env.IMAGE }}:ui-v${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v3

      # Keyless: the signature is bound to this workflow's identity, so a
      # verifier can check *what built the image*, not just that it is signed.
      - name: Sign both images
        run: |
          cosign sign --yes "${IMAGE}@${{ steps.light.outputs.digest }}"
          cosign sign --yes "${IMAGE}@${{ steps.ui.outputs.digest }}"

      # Grouped by commit TITLE — see tools/release-notes.mjs.
      - name: Generate the release notes
        run: node tools/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          make_latest: true
