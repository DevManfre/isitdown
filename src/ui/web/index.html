<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Roadmap 5.21: installable on a phone. The manifest is a static file
         rather than a generated one so it is served straight from disk, and the
         icons beside it are rendered from favicon.svg by tools/pwa-icons.mjs. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IsItDown" />
    <!-- Two, so the installed window's chrome follows the theme the operator
         chose rather than sitting light behind a dark dashboard. -->
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161826" media="(prefers-color-scheme: dark)" />
    <title>IsItDown</title>
    <!-- Runs before stylesheets paint anything: without it the page would show
         the light palette for one frame on a dark desktop. "system" stamps
         nothing and lets the media query decide. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("isitdown.theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
          var lang = localStorage.getItem("isitdown.uiLocale");
          if (lang) document.documentElement.setAttribute("lang", lang);
        } catch (error) {
          /* a blocked localStorage just means the system theme is used */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
