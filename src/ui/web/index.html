<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Roadmap 5.21: installable on a phone. The manifest is a static file
         rather than a generated one so it is served straight from disk, and the
         icons beside it are rendered from favicon.svg by tools/pwa-icons.mjs. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IsItDown" />
    <!-- Two, so the installed window's chrome follows the theme the operator
         chose rather than sitting light behind a dark dashboard. -->
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161826" media="(prefers-color-scheme: dark)" />
    <title>IsItDown</title>
    <!-- Runs before stylesheets paint anything: without it the page would show
         the light palette for one frame on a dark desktop. "system" stamps
         nothing and lets the media query decide. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("isitdown.theme");
          // Same table as STAMPS in hooks/useTheme.tsx: a variant is a ground
          // plus a correction laid over it (roadmap 4.18).
          var stamps = {
            light: ["light"], dark: ["dark"], contrast: ["light", "contrast"],
            colorblind: ["light", "colorblind"], oled: ["dark", "oled"]
          };
          var stamp = stored && stamps.hasOwnProperty(stored) ? stamps[stored] : null;
          if (stamp) {
            document.documentElement.setAttribute("data-theme", stamp[0]);
            if (stamp[1]) document.documentElement.setAttribute("data-variant", stamp[1]);
          }
          // The custom accent (roadmap 4.19), already worked out by
          // lib/accent.ts the last time it was chosen. The high-contrast theme
          // keeps its own accent, so it is not painted there.
          var identity = JSON.parse(localStorage.getItem("isitdown.identity") || "null");
          if (identity && stored !== "contrast") {
            var style = document.documentElement.style;
            style.setProperty("--color-accent", identity.accent);
            style.setProperty("--status-accent", identity.accent);
            style.setProperty("--primary-foreground", identity.foreground);
            style.setProperty("--primary-hover", identity.hover);
          }
          var lang = localStorage.getItem("isitdown.uiLocale");
          if (lang) document.documentElement.setAttribute("lang", lang);
        } catch (error) {
          /* a blocked localStorage just means the system theme is used */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
