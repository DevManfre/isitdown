{{- if eq .Values.edition "ui" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "isitdown.fullname" . }}
  labels:
    {{- include "isitdown.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "isitdown.selectorLabels" . | nindent 4 }}
{{- end }}
